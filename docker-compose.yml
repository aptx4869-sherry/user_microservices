version: '3.8'
services:
  app:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      uvicorn espresso_engine.main_cafe_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 2s
      retries: 10
        
